# EP001 "POV: You're a Roman Legionary" - animation plan (tools/doodle.py image shots).
# Every shot is one illustrated picture from art/<img>, moved by the build (push, pull, pans, shake, jolts)
# with overlays drawn on top (stamp, title, pin, label, flash). "at" = where the shot starts, as a fraction
# of the scene; overlay "in"/"out" = fractions of the shot. Frame is 1920x1080.
# Prompts use tokens that tools/shotlist.py expands: {grunt}, {host}, {crowd}, {style}. Run
#   python tools/shotlist.py episodes/EP001-pov-roman-legionary
# to get shotlist.md: one ready-to-paste prompt per picture. Missing pictures render as "ART NEEDED" cards.

characters:
  grunt: >-
    a skinny young Roman legionary with a very pale, round, deadpan face, dark tired circles under small dot
    eyes, a thin flat mouth, an iron Roman helmet with cheek guards slightly too big for him, red wool tunic,
    segmented iron plate armour, hobnailed sandals
  host: >-
    a short round-bodied archivist with a pale round face, tiny round wire glasses, a few grey hairs combed
    over, an oversized brown wool cardigan with yellow buttons, holding an old brass oil lamp with a red flame
  crowd: >-
    rows of identical small cartoon Roman legionaries with pale round deadpan faces, red tunics, iron helmets
    and red curved rectangular shields

# Character reference pictures: made first, then given to the image tool with every prompt that uses the token.
refs:
  grunt:
    img: REF_grunt.png
    prompt: "character reference sheet of {grunt}, full body, front view and three-quarter view, standing in a relaxed pose, holding a red curved rectangular shield and a javelin, plain light grey background"
  host:
    img: REF_host.png
    prompt: "character reference sheet of {host}, full body, front view and three-quarter view, smug half-smile, plain light grey background"

