# EP002 "Pearl Harbor: The Warnings Washington Ignored" - animation plan (tools/doodle.py image shots).
# Serious geopolitics countdown: wordless maps with overlays, caricatures of the (long dead) leaders, period scenes.
# Every shot is one illustrated picture from art/<img>, moved by the build; overlays (stamp, title, pin, label,
# flash) are drawn on top. "at" = where the shot starts, as a fraction of the scene; overlay "in"/"out" =
# fractions of the shot. Frame is 1920x1080. Maps carry no text: every name comes from an overlay.
# The countdown is carried by stamps ("T-MINUS 12 DAYS"). No living people are drawn.
# HOST_*.png and REF_host.png are copied from EP001 (same Brinkman host pictures).

characters:
  host: >-
    a short round-bodied archivist with a pale round face, tiny round wire glasses, a few grey hairs combed
    over, an oversized brown wool cardigan with yellow buttons, holding an old brass oil lamp with a red flame
  sailor: >-
    young American sailors of 1941 in white sailor uniforms and white round caps
  pacific: >-
    stylised flat cartoon map of the North Pacific Ocean seen from above, Japan and the Kuril Islands on the
    left, the small Hawaiian Islands on the right, flat deep blue sea, absolutely no words, no letters, no labels
  oahu: >-
    stylised flat cartoon map of the island of Oahu seen from above, green mountains, the branching inlets of
    Pearl Harbor on the south coast, flat blue sea, absolutely no words, no letters, no labels

refs:
  host:
    img: REF_host.png
    prompt: "character reference sheet of {host}, full body, front view and three-quarter view, smug half-smile, plain light grey background"

S01:
