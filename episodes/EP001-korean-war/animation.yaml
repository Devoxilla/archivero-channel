# EP001 "The Korean War: The War That Never Ended" - animation plan (tools/doodle.py image shots).
# Serious geopolitics file: wordless maps with overlays, caricatures of the (long dead) leaders, battle scenes.
# Every shot is one illustrated picture from art/<img>, moved by the build; overlays (stamp, title, pin, label,
# flash) are drawn on top. "at" = where the shot starts, as a fraction of the scene; overlay "in"/"out" =
# fractions of the shot. Frame is 1920x1080. Maps carry no text: every name comes from an overlay.
# No living people are drawn.

characters:
  grunt: >-
    a young American infantryman of 1950 with a lean pale face, tired serious eyes and a stubbled jaw, an olive
    M1 steel helmet with a camouflage net, an olive drab field jacket, canvas webbing, carrying an M1 rifle
  host: >-
    a short round-bodied archivist with a pale round face, tiny round wire glasses, a few grey hairs combed
    over, an oversized brown wool cardigan with yellow buttons, holding an old brass oil lamp with a red flame
  crowd: >-
    rows of small cartoon American soldiers of 1950 in olive steel helmets and olive drab field jackets
  map: >-
    stylised flat cartoon map of the Korean Peninsula seen from above, the peninsula standing upright in the
    middle of the picture, flat blue sea around it, the edge of China and Manchuria at the top, Japan at the
    bottom right, absolutely no words, no letters, no labels

refs:
  grunt:
    img: REF_grunt.png
    prompt: "character reference sheet of {grunt}, full body, front view and three-quarter view, standing in a relaxed pose, plain light grey background"
  host:
    img: REF_host.png
    prompt: "character reference sheet of {host}, full body, front view and three-quarter view, smug half-smile, plain light grey background"

