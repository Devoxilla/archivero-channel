name: Make art (free)
on:
  schedule:
    - cron: "17 3 * * *"   # daily: continues episodes whose pictures are not finished (free daily allowance)
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. EP001-korean-war (empty = every unfinished episode)"
        required: false
      max:
        description: "Pictures per run"
        default: "120"
      backend:
        description: "auto (Pollinations, then Cloudflare), pollinations or cloudflare"
        default: cloudflare
      build:
        description: "Start the episode build when every picture exists"
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency: make-art
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml pillow
      - name: Make missing pictures (saved every 10)
        id: art
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          if [ -z "$CF_API_TOKEN" ] && [ -z "$POLLINATIONS_TOKEN" ]; then
            echo "### No CF_ACCOUNT_ID / CF_API_TOKEN secrets yet: nothing to do." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          EP="${{ inputs.episode }}"
          if [ -z "$EP" ]; then  # scheduled run: first episode that still has missing pictures
            for d in episodes/*/animation.yaml; do
              e=$(dirname "$d"); n=$(python -c "import sys,yaml;sys.path.insert(0,'tools');import gemini_art;from pathlib import Path as P;e=P('$e');print(len(gemini_art.jobs(yaml.safe_load((e/'animation.yaml').read_text()),e/'art')))")
              [ "$n" != "0" ] && { EP=$(basename "$e"); break; }
            done
          fi
          [ -z "$EP" ] && { echo "### Every episode has its pictures." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          echo "episode=$EP" >> "$GITHUB_OUTPUT"
          MAX="${{ inputs.max }}"; MAX=${MAX:-150}; BACKEND="${{ inputs.backend }}"; BACKEND=${BACKEND:-cloudflare}
          ep="episodes/$EP"; total=0; left=1; rounds=$(( (MAX + 9) / 10 ))
          for i in $(seq 1 $rounds); do
            python tools/free_art.py "$ep" --max 10 --backend "$BACKEND" --pause 1 | tee run.log
            made=$(grep -oP '^made \K\d+(?=, failed)' run.log || echo 0)
            left=$(grep -oP '\K\d+(?= still missing)' run.log || echo 1)
            if [ "$made" != "0" ]; then
              total=$((total + made))
              python tools/shotlist.py "$ep"
              git add "$ep" && git commit -qm "Art: $made pictures for $EP [skip ci]"
              git pull -q --rebase origin main && git push -q
            fi
            [ "$left" = "0" ] && break
            [ "$made" = "0" ] && { echo "No progress this round, stopping."; break; }
          done
          echo "made=$total" >> "$GITHUB_OUTPUT"; echo "left=$left" >> "$GITHUB_OUTPUT"
          echo "### Art: made $total, $left still missing" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the episode
        if: steps.art.outputs.left == '0' && steps.art.outputs.made != '0' && (github.event_name == 'schedule' || inputs.build)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run build-episode.yml -f episode="${{ steps.art.outputs.episode }}"
