name: Tests
on:
  push:
    paths: ["tools/**", "tests/**", "templates/**"]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y -q fonts-dejavu-core >/dev/null; pip install pytest pillow pyyaml numpy && pytest -q
