name: Voiceover (free, Kokoro)
on:
  push:
    paths: ["episodes/**/script.md"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. EP001-prison-security-levels"
        required: true
      voice:
        description: "bm_george / bm_lewis (British) or am_michael / am_adam (American)"
        default: bm_george
      lang:
        description: "b = British, a = American"
        default: b
jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Pick scripts
        id: pick
        env:
          EP: ${{ inputs.episode }}
        run: |
          if [ -n "$EP" ]; then echo "scripts=episodes/$EP/script.md" >> "$GITHUB_OUTPUT"
          else echo "scripts=$(git diff --name-only HEAD~1 HEAD -- 'episodes/**/script.md' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"; fi
      - name: Install Kokoro (CPU)
        if: steps.pick.outputs.scripts != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9" soundfile
      - name: Render
        if: steps.pick.outputs.scripts != ''
        env:
          VOICE: ${{ inputs.voice || 'bm_george' }}
          LANG_CODE: ${{ inputs.lang || 'b' }}
        run: |
          for s in ${{ steps.pick.outputs.scripts }}; do
            python tools/make_voiceover.py "$s" --voice "$VOICE" --lang "$LANG_CODE"
          done
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.scripts != ''
        with:
          name: voiceover
          path: episodes/**/vo_script/
          retention-days: 30
