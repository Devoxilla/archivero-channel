name: Build episode (voice + video)
on:
  push:
    paths: ["episodes/*/script.md", "episodes/*/shorts/*.md", "episodes/*/animation.yaml", "episodes/*/art/**", "!episodes/*/art/inbox/**"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. EP001-korean-war"
        required: true
      voice:
        description: "bm_george / bm_lewis (British) or am_michael / am_adam (American)"
        default: am_michael
      lang:
        description: "b = British, a = American"
        default: a
      speed:
        description: "Narration speed (1.0 = Kokoro default, 0.92 = slower, more documentary)"
        default: "0.92"
      shorts:
        description: "Also build the Shorts in the episode's shorts/ folder"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-voice.txt }
      - name: Pick episodes
        id: pick
        env:
          EP: ${{ inputs.episode }}
        run: |
          if [ -n "$EP" ]; then eps="episodes/$EP"
          else
            files=$(git diff --name-only HEAD~1 HEAD -- episodes 2>/dev/null || git ls-files episodes)
            eps=$(echo "$files" | grep -oE '^episodes/[^/]+' | sort -u | tr '\n' ' ')
          fi
          eps=$(for e in $eps; do [ -f "$e/script.md" ] && printf '%s ' "$e"; done)
          echo "eps=$eps" >> "$GITHUB_OUTPUT"
          echo "Episodes: $eps"
      - name: Install Kokoro (CPU), ffmpeg, fonts
        if: steps.pick.outputs.eps != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg fonts-dejavu-core fonts-comic-neue
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voice.txt pillow
      - name: Voice and edit
        if: steps.pick.outputs.eps != ''
        env:
          VOICE: ${{ inputs.voice || 'am_michael' }}
          LANG_CODE: ${{ inputs.lang || 'a' }}
          SPEED: ${{ inputs.speed || '0.92' }}
          SHORTS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.shorts) && 'no' || 'yes' }}
        run: |
          for ep in ${{ steps.pick.outputs.eps }}; do
            [ -f "$ep/script.md" ] || continue
            python tools/make_voiceover.py "$ep/script.md" --voice "$VOICE" --lang "$LANG_CODE" --speed "$SPEED"
            python tools/assemble.py "$ep/script.md"
            if [ "$SHORTS" = yes ] && [ -d "$ep/shorts" ]; then
              for s in "$ep"/shorts/*.md; do
                python tools/make_voiceover.py "$s" --voice "$VOICE" --lang "$LANG_CODE" --speed "$SPEED"
                python tools/assemble.py "$s" --vertical
              done
            fi
          done
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.eps != ''
        with:
          name: episode-build
          path: |
            episodes/**/out/
            episodes/**/vo_*/vo_full.wav
          retention-days: 30
      - name: Publish to the builds branch (one folder per episode)
        if: steps.pick.outputs.eps != ''
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          for ep in ${{ steps.pick.outputs.eps }}; do
            d=/tmp/pub/$(basename "$ep"); mkdir -p "$d"
            cp "$ep"/out/* "$d"/ 2>/dev/null || true
            cp "$ep"/shorts/out/*.mp4 "$d"/ 2>/dev/null || true
          done
          # GitHub refuses files over 100 MB: split big videos into 90 MB parts (join with: cat x.mp4.part* > x.mp4)
          find /tmp/pub -type f -size +95M | while read -r f; do split -b 90M -d "$f" "$f.part" && rm "$f"; done
          git fetch -q --depth=1 origin builds && git worktree add -q /tmp/builds origin/builds || git worktree add -q --orphan -b builds /tmp/builds
          cd /tmp/builds
          for d in /tmp/pub/*; do rm -rf "./$(basename "$d")"; done   # replace this episode's old files
          cp -r /tmp/pub/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keep only the latest snapshot (no history of old videos)
          git checkout -q --orphan snapshot && git add -A && git commit -qm "Build ${GITHUB_SHA::7}" && git push -q -f origin HEAD:builds
